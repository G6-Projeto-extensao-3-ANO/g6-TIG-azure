services:
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=urubu100
      - DOCKER_INFLUXDB_INIT_ORG=faculdade
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
      # Token estático para o Telegraf
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=TokenSecretoEstaticoParaOTelegraf2026LabIoT
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iot-network
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    container_name: iot-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
    networks:
      - iot-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot-grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/iotrace.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      INFLUXDB_TOKEN: TokenSecretoEstaticoParaOTelegraf2026LabIoT
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "2s"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [influxdb]
    networks: [iot-network]
    restart: unless-stopped

#  grafana:
#    image: grafana/grafana-oss:latest
#    container_name: iot-grafana
#    environment:
#      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
#      - GF_SERVER_SERVE_FROM_SUB_PATH=true
#    volumes:
#      - grafana_data:/var/lib/grafana
#    depends_on:
#      - influxdb
#    networks:
#      - iot-network
#    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - influxdb
      - grafana
      - node-red
    networks:
      - iot-network
      - app_net
    restart: unless-stopped

    node-red:
      image: nodered/node-red:latest
      restart: unless-stopped
      environment:
        - TZ=America/Sao_Paulo
      volumes:
        - node_red_data:/data
      networks:
        - app_net
      expose:
        - "1880"

  #nginx:
  #  image: nginx:stable-alpine
  #  restart: unless-stopped
  #  depends_on:
  #    - node-red
  #  ports:
  #    - "80:80"
  #  volumes:
  #    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
