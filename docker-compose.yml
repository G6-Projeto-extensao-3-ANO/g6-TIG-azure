services:
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=urubu100
      - DOCKER_INFLUXDB_INIT_ORG=faculdade
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
      # Token estático para o Telegraf
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=TokenSecretoEstaticoParaOTelegraf2026LabIoT
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iot-network
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    container_name: iot-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
    networks:
      - iot-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot-grafana
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - iot-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - influxdb
      - grafana
    networks:
      - iot-network
    restart: unless-stopped

networks:
  iot-network:
    driver: bridge

volumes:
  influxdb_data:
  grafana_data: