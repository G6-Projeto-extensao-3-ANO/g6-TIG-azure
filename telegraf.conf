[agent]
interval = "5s" # Tempo de intervalo na coleta das métricas
round_interval = true
metric_batch_size = 1000
metric_buffer_limit = 10000
collection_jitter = "0s"
flush_interval = "5s"
flush_jitter = "0s"
precision = "0s"
hostname = "iot-server"
omit_hostname = true
# ==========================================
# INPUT: Ingestão via Broker MQTT
# ==========================================
[[inputs.mqtt_consumer]]
servers = ["tcp://68.211.138.113:1883"] # ipv4 do Broker
# Escuta todos os sub-tópicos dentro de 'sensores/'
topics = [
"sensores/#",
]
data_format = "json_v2"
[[inputs.mqtt_consumer.json_v2]]
measurement_name = "telemetria_iot"
timestamp_path = "timestamp"
timestamp_format = "unix"
# --------------------------------------------------------------------------
# 1. TAGS (Indexados para WHERE e GROUP BY) -> Usar json_v2.tag
# --------------------------------------------------------------------------
[[inputs.mqtt_consumer.json_v2.tag]]
path = "dispositivo.id"
rename = "dispositivo_id"
type = "string"
[[inputs.mqtt_consumer.json_v2.tag]]
path = "dispositivo.status"
rename = "status"
type = "string"
[[inputs.mqtt_consumer.json_v2.tag]]
path = "localizacao.bloco"
rename = "bloco"
type = "string"
[[inputs.mqtt_consumer.json_v2.tag]]
path = "localizacao.sala"
rename = "sala"
type = "string"
# --------------------------------------------------------------------------
# 2. FIELDS (Valores dos gráficos) -> Usar json_v2.field
# --------------------------------------------------------------------------
[[inputs.mqtt_consumer.json_v2.field]]
path = "leitura.temperatura"
rename = "temperatura"
type = "float"
[[inputs.mqtt_consumer.json_v2.field]]
path = "leitura.umidade"
rename = "umidade"
type = "float"
[[inputs.mqtt_consumer.json_v2.field]]
path = "leitura.mensagem_id"
rename = "mensagem_id"
type = "int"
# ==========================================
# OUTPUT: Escrita Automática no InfluxDB v2
# ==========================================
[[outputs.influxdb_v2]]
urls = ["http://influxdb:8086"]
# Deve bater exatamente com o DOCKER_INFLUXDB_INIT_ADMIN_TOKEN do docker-compose
token = "TokenSecretoEstaticoParaOTelegraf2026LabIoT"
# Devem bater com a Organização e Bucket do docker-compose
organization = "faculdade"
bucket = "sensores"