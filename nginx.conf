server {
    listen 80;
    server_name localhost;

    # Encaminha o tráfego da URL / para a interface e API do InfluxDB
    location / {
        proxy_pass http://influxdb:8086/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ajuste opcional para uploads pesados ou conexões de streaming longas da UI
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Grafana em sub-caminho (GF_SERVER_SERVE_FROM_SUB_PATH=true).
    # Sem barra final no proxy_pass: o Grafana espera receber o prefixo /grafana/.
    # Upgrade/Connection: necessários para o Grafana Live (WebSocket), usado pela dashboard (liveNow).
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /node-red/ {
        proxy_pass http://node-red:1880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
